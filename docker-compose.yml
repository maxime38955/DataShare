version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: datashare-postgres
    environment:
      POSTGRES_DB: datashare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecretpassword
    ports:
    - "5433:5432"  
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data: